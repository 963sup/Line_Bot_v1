# Local CLI configuration plus native File Bucket desired state.
# Application PostgreSQL schema remains in supabase/schemas, not provider-owned schemas.
project_id = "Line_Bot"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
# Development is schema-first. db push/reset must not replay historical migrations.
enabled = false
# Numeric prefixes define the canonical declarative schema order.
schema_paths = ["./schemas/*.sql"]

[db.seed]
enabled = false
sql_paths = []
# Supabase CLI is the sole desired-state authority for the File bucket.
# This is a private provider object store, not an additional Repository ACL.
[storage]
enabled = true
file_size_limit = "50MB"

[storage.buckets.repository-files]
public = false
file_size_limit = "45MiB"
