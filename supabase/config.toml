# Local development only; managed platform schemas stay outside app_private.
project_id = "Line_Bot"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
# Development is schema-first. db push/reset must not replay historical migrations.
enabled = false
# Numeric prefixes define the canonical declarative schema order.
schema_paths = ["./schemas/*.sql"]

[db.seed]
enabled = false
sql_paths = []