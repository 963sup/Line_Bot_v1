Follow root AGENTS.md, .github/AGENTS.md and .codex/agents/AGENTS.md. Use agentic-actions-auditor and github-actions skills only for their read-only audit steps. Apply first-principles reasoning: trace untrusted event input, checkout/artifact/environment hops, token or secret exposure, and the final execution consequence. Use `pnpm semantic plan` then `pnpm semantic context` only when workflow ownership or its product/provider boundary is unresolved.

