# Project defaults; trusted projects only. Live session overrides take precedence.
# Preserve the user's permissions, approval policy and MCP settings.
# Trusted project shell preapprovals load automatically from .codex/rules/*.rules.
# Rules govern commands; MCP tool preapprovals are configured per server below.
# Restart Codex after changes; live session and managed policies take precedence.
# Primary model: GPT-6 Astra (gpt-6-astra).
developer_instructions = """
Follow root AGENTS.md and the nearest local AGENTS.md for scoped repository constraints.
At the start of repository work, follow docs/reference/engineering/development-workflow.md for the change loop and proactive tool selection.
Read .codex/agents/AGENTS.md and apply its autonomous delegation policy when independent work or specialist evidence improves the result; current task and tool restrictions take precedence.
"""

[agents]
enabled = true
# Default subagent model: GPT-5.6 Sol (gpt-5.6-sol).
# Opt-in GPT-6 development roles set their own model in agents/*.toml.
default_subagent_model = "gpt-5.6-sol"
default_subagent_reasoning_effort = "medium"
# Excludes the primary agent: 1 primary + up to 5 subagents.
# Ceiling, not target team size; only parallelize independent, bounded work.
max_concurrent_threads_per_session = 5

[mcp_servers.next-devtools]
# Shared by the parent and its subagents; per-tool overrides take precedence.
default_tools_approval_mode = "approve"
command = "pnpm"
args = ["exec", "next-devtools-mcp"]
startup_timeout_sec = 60

[mcp_servers.next-devtools.env]
NEXT_DEVTOOLS_HOST = "127.0.0.1"

[mcp_servers.next-devtools.tools.nextjs_docs]
approval_mode = "approve"

[mcp_servers.next-devtools.tools.nextjs_index]
approval_mode = "approve"

[mcp_servers.shadcn]
# Shared by the parent and its subagents; per-tool overrides take precedence.
default_tools_approval_mode = "approve"
command = "pnpm"
args = ["--dir", "apps/web", "exec", "shadcn", "mcp"]
startup_timeout_sec = 60

[mcp_servers.shadcn.tools.get_project_registries]
approval_mode = "approve"

[mcp_servers.sentry]
# Official hosted MCP uses OAuth; request org:read,project:read,event:read scopes.
# Project scoping supplies query defaults, not business write authorization.
url = "https://mcp.sentry.dev/mcp/963sup/sentry"
