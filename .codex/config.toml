# Official Codex project configuration.
# Secrets stay in the environment or Codex-managed authentication.
# Project config remains the versioned source; it does not contain credentials.

# Root settings must precede named TOML tables.
# Project-wide execution preferences; host and service policies still apply.
approval_policy = "never"
sandbox_mode = "danger-full-access"
tool_output_token_limit = 3000
# Keep root + nested guidance within the default budget on fresh hosts.
project_doc_max_bytes = 32768
web_search = "live"

# Defaults for all connected apps, including newly enabled connectors.
[apps._default]
enabled = true
destructive_enabled = true
open_world_enabled = true
default_tools_approval_mode = "auto"

[features]
hooks = true

# Public official documentation; no local executable or credential required.
[mcp_servers.openaiDeveloperDocs]
default_tools_approval_mode = "auto"
url = "https://developers.openai.com/mcp"
startup_timeout_sec = 30

# Serena is prepared by Cloud environment installation.
[mcp_servers.serena]
experimental_environment = "remote"
env_vars = [{ name = "HTTP_PROXY", source = "remote" }, { name = "HTTPS_PROXY", source = "remote" }, { name = "NO_PROXY", source = "remote" }, { name = "SSL_CERT_FILE", source = "remote" }, { name = "REQUESTS_CA_BUNDLE", source = "remote" }, { name = "NODE_EXTRA_CA_CERTS", source = "remote" }]
command = "serena"
args = [ "start-mcp-server", "--project-from-cwd", "--context=codex", "--agent-interface=REPL", "--open-web-dashboard=false"]
startup_timeout_sec = 60
default_tools_approval_mode = "auto"

# Context7 hosted MCP. Set CONTEXT7_API_KEY only when the account requires it.
[mcp_servers.context7]
default_tools_approval_mode = "auto"
url = "https://mcp.context7.com/mcp"
bearer_token_env_var = "CONTEXT7_API_KEY"
startup_timeout_sec = 30

# Official GitHub hosted MCP. Token comes from the host environment/network secret.
# Keep GitHub CLI's GH_TOKEN separate; no credential values belong in this file.
[mcp_servers.github]
default_tools_approval_mode = "auto"
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_MCP_TOKEN"
http_headers = { "X-MCP-Toolsets" = "repos,issues,pull_requests" }
startup_timeout_sec = 30

# Next.js DevTools MCP uses the workspace-pinned executable.
[mcp_servers.next-devtools]
experimental_environment = "remote"
env_vars = [{ name = "HTTP_PROXY", source = "remote" }, { name = "HTTPS_PROXY", source = "remote" }, { name = "NO_PROXY", source = "remote" }, { name = "SSL_CERT_FILE", source = "remote" }, { name = "REQUESTS_CA_BUNDLE", source = "remote" }, { name = "NODE_EXTRA_CA_CERTS", source = "remote" }]
default_tools_approval_mode = "auto"
command = "pnpm"
args = [ "exec", "next-devtools-mcp"]
startup_timeout_sec = 30

# shadcn MCP uses the workspace-pinned CLI from apps/web.
[mcp_servers.shadcn]
experimental_environment = "remote"
env_vars = [{ name = "HTTP_PROXY", source = "remote" }, { name = "HTTPS_PROXY", source = "remote" }, { name = "NO_PROXY", source = "remote" }, { name = "SSL_CERT_FILE", source = "remote" }, { name = "REQUESTS_CA_BUNDLE", source = "remote" }, { name = "NODE_EXTRA_CA_CERTS", source = "remote" }]
default_tools_approval_mode = "auto"
command = "pnpm"
args = [ "--filter", "@line_bot_v1/web", "exec", "shadcn", "mcp"]
startup_timeout_sec = 30

[agents]
enabled = true
max_concurrent_threads_per_session = 4
max_depth = 2
default_subagent_reasoning_effort = "medium"

[agents.reviewer]
description = "Review code changes for correctness, regressions, and maintainability."
config_file = "./agents/reviewer.toml"

[agents.debugger]
description = "Diagnose and fix test, build, runtime, and integration failures."
config_file = "./agents/debugger.toml"

[agents.architect]
description = "Review architecture, module boundaries, dependency direction, and data flow."
config_file = "./agents/architect.toml"

[agents.requirement-architect]
description = "Define evidence-based scope, removal candidates, acceptance criteria and complete implementation plans."
config_file = "./agents/requirement-architect.toml"

[agents.mcp-maintainer]
description = "Diagnose MCP registration, host refresh, credentials and real tool-call readiness using the official Codex CLI."
config_file = "./agents/mcp-maintainer.toml"

[agents.test-engineer]
description = "Analyze test coverage, design regression cases, and identify untested behavior."
config_file = "./agents/test-engineer.toml"

[agents.release-gatekeeper]
description = "Evaluate release readiness, branch protection, CI evidence, and merge gates."
config_file = "./agents/release-gatekeeper.toml"

[agents.database-steward]
description = "Review Supabase migrations, schema drift, RLS, rollback, and data compatibility."
config_file = "./agents/database-steward.toml"

[agents.observability-investigator]
description = "Investigate Sentry, Vercel logs, trace IDs, and production error evidence."
config_file = "./agents/observability-investigator.toml"

[agents.performance-cost-analyst]
description = "Analyze latency, token usage, database query cost, bundle size, and provider cost."
config_file = "./agents/performance-cost-analyst.toml"

[agents.accessibility-ux-auditor]
description = "Audit UI accessibility, keyboard flows, forms, errors, responsive behavior, and UX friction."
config_file = "./agents/accessibility-ux-auditor.toml"

[agents.documentation-curator]
description = "Maintain repository documentation, AGENTS guidance, Serena README, and durable memory routing."
config_file = "./agents/documentation-curator.toml"

[agents.contract-steward]
description = "Maintain public API, event, HTTP, provider, and package contract compatibility."
config_file = "./agents/contract-steward.toml"

[agents.e2e-journey-engineer]
description = "Validate complete browser and service journeys across upload, analysis, persistence, and recovery."
config_file = "./agents/e2e-journey-engineer.toml"

[agents.dependency-steward]
description = "Maintain workspace dependencies, lockfile integrity, upgrades, and supply-chain evidence."
config_file = "./agents/dependency-steward.toml"

[agents.lifecycle-owner]
description = "Plan feature rollout, flags, backfills, deprecation, migration sequencing, and rollback."
config_file = "./agents/lifecycle-owner.toml"

[agents.data-quality-analyst]
description = "Validate extraction quality, provenance, completeness, unknown fields, and cross-document consistency."
config_file = "./agents/data-quality-analyst.toml"

[agents.integration-validator]
description = "Validate cross-service contracts, runtime behavior, and external integration evidence."
config_file = "./agents/integration-validator.toml"

[mcp_servers.sentry]
default_tools_approval_mode = "auto"
# Official hosted MCP uses OAuth; request org:read,project:read,event:read scopes.
# Project scoping supplies query defaults, not business write authorization.
url = "https://mcp.sentry.dev/mcp/963sup/sentry"

[agents.security-auditor]
description = "Audit application security, authentication, authorization, secrets, and Supabase RLS."
config_file = "./agents/security-auditor.toml"
