# Official Codex project configuration.
# Secrets stay in the environment or Codex-managed authentication.

# Bootstrap installs pinned Serena v2 with `uv tool install`; the launcher only
# selects that prepared executable and never resolves/downloads at MCP startup.
[mcp_servers.serena]
command = "bash"
args = [".codex/bootstrap/install.sh", "--serena", "start-mcp-server", "--project-from-cwd", "--context=codex", "--agent-interface=REPL", "--open-web-dashboard=false"]
startup_timeout_sec = 60
default_tools_approval_mode = "approve"

# Context7 hosted MCP. Set CONTEXT7_API_KEY only when the account requires it.
[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
startup_timeout_sec = 30

# Official GitHub hosted MCP. Token comes from the host environment/network secret.
# Keep GitHub CLI's GH_TOKEN separate; no credential values belong in this file.
[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_MCP_TOKEN"
http_headers = { "X-MCP-Toolsets" = "repos,issues,pull_requests" }
startup_timeout_sec = 30

# Next.js DevTools MCP uses the workspace-pinned executable.
[mcp_servers.next-devtools]
command = "bash"
args = [".codex/bootstrap/install.sh", "--exec", "pnpm", "exec", "next-devtools-mcp"]
startup_timeout_sec = 30

# shadcn MCP uses the workspace-pinned CLI from apps/web.
[mcp_servers.shadcn]
command = "bash"
args = [".codex/bootstrap/install.sh", "--exec", "pnpm", "--filter", "@line_bot_v1/web", "exec", "shadcn", "mcp"]
startup_timeout_sec = 30

[agents]
enabled = true
max_concurrent_threads_per_session = 4
max_depth = 2
default_subagent_reasoning_effort = "medium"

[agents.reviewer]
description = "Review code changes for correctness, regressions, and maintainability."
config_file = "./agents/reviewer.toml"

[agents.debugger]
description = "Diagnose and fix test, build, runtime, and integration failures."
config_file = "./agents/debugger.toml"

[agents.architect]
description = "Review architecture, module boundaries, dependency direction, and data flow."
config_file = "./agents/architect.toml"

[mcp_servers.next-devtools.tools.nextjs_index]
approval_mode = "approve"

[mcp_servers.shadcn.tools.get_project_registries]
approval_mode = "approve"

[mcp_servers.sentry]
# Official hosted MCP uses OAuth; request org:read,project:read,event:read scopes.
# Project scoping supplies query defaults, not business write authorization.
url = "https://mcp.sentry.dev/mcp/963sup/sentry"

[agents.security-auditor]
description = "Audit application security, authentication, authorization, secrets, and Supabase RLS."
config_file = "./agents/security-auditor.toml"
