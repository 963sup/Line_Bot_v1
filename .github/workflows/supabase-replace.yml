name: Supabase Manual Reconcile

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare/review a plan, or apply an already reviewed exact plan
        required: true
        type: choice
        options:
          - prepare-plan
          - apply
      confirm_project:
        description: Type the target Supabase project ref
        required: true
        type: string
      legacy_enterprise_name:
        description: Only when prepare reports one unresolved legacy Enterprise, provide its canonical name
        required: false
        type: string
      legacy_enterprise_slug:
        description: Only when prepare reports one unresolved legacy Enterprise, provide its canonical URL slug
        required: false
        type: string
      reviewed_plan_run_id:
        description: For apply, paste the successful prepare-plan workflow run ID
        required: false
        type: string
      reviewed_plan_sha256:
        description: For apply, paste the exact lowercase SHA-256 from that prepare-plan artifact
        required: false
        type: string
      recovery_evidence_reference:
        description: For apply, provide a non-secret backup/PITR/restore evidence reference
        required: false
        type: string
      confirm_recovery:
        description: For apply, type "recovery verified nmssogphayjymjpbnrxv"
        required: false
        type: string
      confirm_apply:
        description: For apply, type "apply reviewed plan nmssogphayjymjpbnrxv"
        required: false
        type: string

permissions:
  contents: read
  actions: read
  checks: read
  statuses: read

jobs:
  reconcile:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirm_project == 'nmssogphayjymjpbnrxv' &&
      (
        inputs.operation == 'prepare-plan' ||
        (
          inputs.operation == 'apply' &&
          inputs.confirm_recovery == 'recovery verified nmssogphayjymjpbnrxv' &&
          inputs.confirm_apply == 'apply reviewed plan nmssogphayjymjpbnrxv'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: supabase-production-nmssogphayjymjpbnrxv
      cancel-in-progress: false
    steps:
      - name: Require exact main revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          main_sha="$(gh api "repos/$REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$SHA" = "$main_sha" || {
            echo "Manual reconciliation must run against the current main revision."
            exit 1
          }

      - name: Require repository validation for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          result="$(gh api "repos/$REPOSITORY/commits/$SHA/check-runs" --jq '[.check_runs[] | select(.name == "validate" and .app.slug == "github-actions")][0] | "\(.status // "")|\(.conclusion // "")"')"
          status="${result%%|*}"
          conclusion="${result#*|}"
          test "$status" = "completed" && test "$conclusion" = "success" || {
            echo "Repository validation is not successful for $SHA: $status/$conclusion"
            exit 1
          }

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Validate reviewed plan provenance and recovery evidence
        if: inputs.operation == 'apply'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REVIEWED_PLAN_RUN_ID: ${{ inputs.reviewed_plan_run_id }}
          REVIEWED_PLAN_SHA256: ${{ inputs.reviewed_plan_sha256 }}
          RECOVERY_EVIDENCE_REFERENCE: ${{ inputs.recovery_evidence_reference }}
        run: |
          [[ "$REVIEWED_PLAN_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "Apply requires the workflow run ID of the reviewed prepare-plan."
            exit 1
          }
          [[ "$REVIEWED_PLAN_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "Apply requires the exact lowercase SHA-256 from the reviewed prepare-plan artifact."
            exit 1
          }
          test -n "${RECOVERY_EVIDENCE_REFERENCE//[[:space:]]/}" || {
            echo "Apply requires a non-secret backup/PITR/restore evidence reference."
            exit 1
          }
          test "${#RECOVERY_EVIDENCE_REFERENCE}" -le 512 || {
            echo "Recovery evidence reference must be 512 characters or fewer."
            exit 1
          }

          gh api "repos/$REPOSITORY/actions/runs/$REVIEWED_PLAN_RUN_ID" > reviewed-run.json
          jq -e --arg sha "$SHA" '
            .event == "workflow_dispatch" and
            .head_sha == $sha and
            .path == ".github/workflows/supabase-replace.yml" and
            .status == "completed" and
            .conclusion == "success"
          ' reviewed-run.json >/dev/null || {
            echo "Reviewed prepare-plan run is not a successful run of this workflow for current main."
            exit 1
          }

          mapfile -t artifact_ids < <(
            gh api "repos/$REPOSITORY/actions/runs/$REVIEWED_PLAN_RUN_ID/artifacts" \
              --jq ".artifacts[] | select(.name == \"supabase-manual-prepare-plan-$SHA\") | .id"
          )
          test "${#artifact_ids[@]}" -eq 1 || {
            echo "Reviewed prepare-plan run must contain exactly one matching reconciliation artifact."
            exit 1
          }
          gh api "repos/$REPOSITORY/actions/artifacts/${artifact_ids[0]}/zip" > reviewed-plan.zip
          unzip -p reviewed-plan.zip plan-provenance.json > reviewed-plan-provenance.json
          jq -e \
            --arg project "nmssogphayjymjpbnrxv" \
            --arg sha "$SHA" \
            --arg run_id "$REVIEWED_PLAN_RUN_ID" \
            --arg plan_sha "$REVIEWED_PLAN_SHA256" \
            '.projectRef == $project and
             .sourceSha == $sha and
             .workflowRunId == $run_id and
             .planSha256 == $plan_sha' \
            reviewed-plan-provenance.json >/dev/null || {
              echo "Reviewed plan provenance does not match current source, target, run, or plan hash."
              exit 1
            }

      - name: Record manual authorization evidence
        if: inputs.operation == 'apply'
        shell: bash
        env:
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          REVIEWED_PLAN_RUN_ID: ${{ inputs.reviewed_plan_run_id }}
          REVIEWED_PLAN_SHA256: ${{ inputs.reviewed_plan_sha256 }}
          RECOVERY_EVIDENCE_REFERENCE: ${{ inputs.recovery_evidence_reference }}
        run: |
          mkdir -p .artifacts/supabase-remote
          jq -n \
            --arg project_ref "nmssogphayjymjpbnrxv" \
            --arg source_sha "$SHA" \
            --arg apply_run_id "$RUN_ID" \
            --arg reviewed_plan_run_id "$REVIEWED_PLAN_RUN_ID" \
            --arg reviewed_plan_sha256 "$REVIEWED_PLAN_SHA256" \
            --arg recovery_evidence_reference "$RECOVERY_EVIDENCE_REFERENCE" \
            '{
              projectRef: $project_ref,
              sourceSha: $source_sha,
              applyRunId: $apply_run_id,
              reviewedPlanRunId: $reviewed_plan_run_id,
              reviewedPlanSha256: $reviewed_plan_sha256,
              recoveryEvidenceReference: $recovery_evidence_reference,
              recoveryAttested: true
            }' > .artifacts/supabase-remote/manual-authorization.json

      - name: Prepare preserve-data compatibility expansion
        run: pnpm schema:remote prepare
        env:
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_CONFIRM_PROJECT: nmssogphayjymjpbnrxv
          SUPABASE_LEGACY_ENTERPRISE_NAME: ${{ inputs.legacy_enterprise_name }}
          SUPABASE_LEGACY_ENTERPRISE_SLUG: ${{ inputs.legacy_enterprise_slug }}

      - name: Generate exact reconciliation plan for review
        if: inputs.operation == 'prepare-plan'
        run: pnpm schema:remote plan
        env:
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_CONFIRM_PROJECT: nmssogphayjymjpbnrxv

      - name: Record prepare-plan provenance
        if: inputs.operation == 'prepare-plan'
        shell: bash
        env:
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          plan_sha="$(tr -d '\r\n' < .artifacts/supabase-remote/plan.sha256)"
          [[ "$plan_sha" =~ ^[0-9a-f]{64}$ ]] || {
            echo "prepare-plan did not produce a valid plan SHA-256."
            exit 1
          }
          jq -n \
            --arg project_ref "nmssogphayjymjpbnrxv" \
            --arg source_sha "$SHA" \
            --arg workflow_run_id "$RUN_ID" \
            --arg plan_sha256 "$plan_sha" \
            '{
              projectRef: $project_ref,
              sourceSha: $source_sha,
              workflowRunId: $workflow_run_id,
              planSha256: $plan_sha256
            }' > .artifacts/supabase-remote/plan-provenance.json

      - name: Apply only the reviewed exact plan
        if: inputs.operation == 'apply'
        run: pnpm schema:remote sync --allow-manual
        env:
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_CONFIRM_PROJECT: nmssogphayjymjpbnrxv
          SUPABASE_REVIEWED_PLAN_SHA256: ${{ inputs.reviewed_plan_sha256 }}

      - name: Preserve manual reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-manual-${{ inputs.operation }}-${{ github.sha }}
          path: |
            .artifacts/supabase-remote/plan.sql
            .artifacts/supabase-remote/plan.sha256
            .artifacts/supabase-remote/plan-provenance.json
            .artifacts/supabase-remote/manual-authorization.json
            .artifacts/supabase-remote/verification.sql
            .artifacts/supabase-remote/migration-history.before.txt
            .artifacts/supabase-remote/migration-history.after.txt
            .artifacts/supabase-remote/general-management-prepare.json
          if-no-files-found: ignore
          retention-days: 7
