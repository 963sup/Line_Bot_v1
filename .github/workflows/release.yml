name: Release
run-name: Release ${{ github.sha }}

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  checks: read
  statuses: read

jobs:
  validation:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  release_plan:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      head_sha: ${{ steps.plan.outputs.head_sha }}
      schema_changed: ${{ steps.plan.outputs.schema_changed }}
      web_affected: ${{ steps.plan.outputs.web_affected }}
      rich_menu_changed: ${{ steps.plan.outputs.rich_menu_changed }}
      scheduler_changed: ${{ steps.plan.outputs.scheduler_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Plan owner-specific external convergence
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: pnpm github:release-plan --sha "$SHA"

  supabase:
    needs: [release_plan, validation]
    if: needs.validation.result == 'success' && needs.release_plan.result == 'success' && needs.release_plan.outputs.schema_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_REMOTE_MUTATION_CONTEXT: validated-main
    concurrency:
      group: supabase-production-nmssogphayjymjpbnrxv
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release_plan.outputs.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Require current main before remote reconciliation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SHA: ${{ needs.release_plan.outputs.head_sha }}
        run: pnpm github:current-main --sha "$SHA"

      - name: Synchronize declared schema
        run: pnpm schema:remote sync
        env:
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_CONFIRM_PROJECT: nmssogphayjymjpbnrxv

      - name: Preserve reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-reconciliation-${{ needs.release_plan.outputs.head_sha }}
          path: |
            .artifacts/supabase-remote/plan.sql
            .artifacts/supabase-remote/plan.sha256
            .artifacts/supabase-remote/verification.sql
            .artifacts/supabase-remote/migration-history.before.txt
            .artifacts/supabase-remote/migration-history.after.txt
          if-no-files-found: ignore
          retention-days: 7

  deployment:
    concurrency:
      group: vercel-production-mini-app-line
      cancel-in-progress: false
    needs: [release_plan, validation, supabase]
    if: >-
      always() &&
      needs.validation.result == 'success' && needs.release_plan.result == 'success' &&
      needs.release_plan.outputs.web_affected == 'true' &&
      (needs.supabase.result == 'success' || (needs.release_plan.outputs.schema_changed != 'true' && needs.supabase.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release_plan.outputs.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile

      - name: Require current main before production deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SHA: ${{ needs.release_plan.outputs.head_sha }}
        run: pnpm github:current-main --sha "$SHA"

      - name: Deploy and read back exact production revision
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SHA: ${{ needs.release_plan.outputs.head_sha }}
        run: pnpm vercel:deploy:production --live --sha "$SHA"

  rich_menu:
    concurrency:
      group: line-rich-menu-production
      cancel-in-progress: false
    needs: [release_plan, validation]
    if: >-
      needs.validation.result == 'success' && needs.release_plan.result == 'success' &&
      needs.release_plan.outputs.rich_menu_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release_plan.outputs.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter='@line_bot_v1/web^...'

      - name: Require current main before LINE mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SHA: ${{ needs.release_plan.outputs.head_sha }}
        run: pnpm github:current-main --sha "$SHA"

      - name: Publish Rich Menu desired state
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: pnpm line:rich-menu publish all

  attendance_scheduler:
    needs: [release_plan, validation, supabase, deployment]
    env:
      SUPABASE_REMOTE_MUTATION_CONTEXT: validated-main
    if: >-
      always() &&
      needs.validation.result == 'success' && needs.release_plan.result == 'success' &&
      (needs.supabase.result == 'success' || (needs.release_plan.outputs.schema_changed != 'true' && needs.supabase.result == 'skipped')) &&
      needs.release_plan.outputs.scheduler_changed == 'true' &&
      (needs.deployment.result == 'success' || (needs.release_plan.outputs.web_affected != 'true' && needs.deployment.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: supabase-production-nmssogphayjymjpbnrxv
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release_plan.outputs.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Require current main before Attendance scheduler mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SHA: ${{ needs.release_plan.outputs.head_sha }}
        run: pnpm github:current-main --sha "$SHA"

      - name: Reconcile and read back Attendance scheduler
        env:
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_CONFIRM_PROJECT: nmssogphayjymjpbnrxv
          ATTENDANCE_WORKER_SECRET: ${{ secrets.ATTENDANCE_WORKER_SECRET }}
          SHA: ${{ needs.release_plan.outputs.head_sha }}
        run: pnpm attendance:scheduler reconcile --live --sha "$SHA"
