name: Release
run-name: Release ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  checks: read
  statuses: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      head_sha: ${{ steps.changed.outputs.head_sha }}
      schema_changed: ${{ steps.changed.outputs.schema_changed }}
      rich_menu_changed: ${{ steps.changed.outputs.rich_menu_changed }}
    steps:
      - name: Require validated current main before release routing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          main_sha="$(gh api "repos/$REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$VALIDATED_SHA" = "$main_sha" || {
            echo "Validated commit was superseded before release routing."
            exit 1
          }

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect release-owned source changes
        id: changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          baseline_sha=""
          gh api "repos/$REPOSITORY/actions/workflows/release.yml/runs?branch=main&event=workflow_run&status=success&per_page=100" \
            --jq '.workflow_runs[] | .display_title' > release-runs.txt
          while IFS= read -r display_title; do
            [[ "$display_title" =~ ^Release\ [0-9a-f]{40}$ ]] || continue
            candidate_sha="${display_title#Release }"
            git cat-file -e "$candidate_sha^{commit}" 2>/dev/null || continue
            git merge-base --is-ancestor "$candidate_sha" "$VALIDATED_SHA" || continue
            baseline_sha="$candidate_sha"
            break
          done < release-runs.txt
          if [ -n "$baseline_sha" ] && git cat-file -e "$baseline_sha^{commit}" 2>/dev/null; then
            git diff --name-only "$baseline_sha" "$VALIDATED_SHA" > changed-files.txt
          else
            empty_tree="$(git hash-object -t tree /dev/null)"
            git diff --name-only "$empty_tree" "$VALIDATED_SHA" > changed-files.txt
          fi
          schema_changed=false
          rich_menu_changed=false
          if grep -Eq '^supabase/schemas/.*\.sql$' changed-files.txt; then
            schema_changed=true
          fi
          if grep -Eq '^(assets/line/rich-menu/|apps/web/src/modules/assistant/rich-menu/(definition|desired-state\.server)\.ts$)' changed-files.txt; then
            rich_menu_changed=true
          fi
          echo "head_sha=$VALIDATED_SHA" >> "$GITHUB_OUTPUT"
          echo "schema_changed=$schema_changed" >> "$GITHUB_OUTPUT"
          echo "rich_menu_changed=$rich_menu_changed" >> "$GITHUB_OUTPUT"

  supabase:
    needs: gate
    if: needs.gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: supabase-production-nmssogphayjymjpbnrxv
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Require current main before remote reconciliation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ needs.gate.outputs.head_sha }}
        run: |
          main_sha="$(gh api "repos/$REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$SHA" = "$main_sha" || {
            echo "Release was superseded before Supabase reconciliation."
            exit 1
          }

      - name: Repair additive runtime compatibility
        run: pnpm schema:remote repair
        env:
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_CONFIRM_PROJECT: nmssogphayjymjpbnrxv

      - name: Converge changed declarative schema
        if: needs.gate.outputs.schema_changed == 'true'
        run: pnpm schema:remote sync
        env:
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_CONFIRM_PROJECT: nmssogphayjymjpbnrxv

      - name: Verify unchanged declarative schema before publication
        if: needs.gate.outputs.schema_changed != 'true'
        run: pnpm schema:remote verify
        env:
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_CONFIRM_PROJECT: nmssogphayjymjpbnrxv

      - name: Preserve reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-reconciliation-${{ needs.gate.outputs.head_sha }}
          path: |
            .artifacts/supabase-remote/account-login-compat.sql
            .artifacts/supabase-remote/daily-check-in-compat.sql
            .artifacts/supabase-remote/plan.sql
            .artifacts/supabase-remote/plan.sha256
            .artifacts/supabase-remote/verification.sql
            .artifacts/supabase-remote/migration-history.before.txt
            .artifacts/supabase-remote/migration-history.after.txt
            .artifacts/supabase-remote/general-management-prepare.json
          if-no-files-found: ignore
          retention-days: 7

  deployment:
    needs: [gate, supabase]
    if: >-
      always() &&
      needs.gate.result == 'success' &&
      needs.supabase.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Require current main before production deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ needs.gate.outputs.head_sha }}
        run: |
          main_sha="$(gh api "repos/$REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$SHA" = "$main_sha" || {
            echo "Release was superseded before Vercel production deployment."
            exit 1
          }

      - name: Deploy and read back exact production revision
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SHA: ${{ needs.gate.outputs.head_sha }}
        run: pnpm vercel:deploy:production -- --live --sha "$SHA"

  rich_menu:
    needs: [gate, deployment]
    if: needs.gate.outputs.rich_menu_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter='@line-work/web^...'
      - run: pnpm line:rich-menu preview all

      - name: Require current main before LINE mutation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ needs.gate.outputs.head_sha }}
        run: |
          main_sha="$(gh api "repos/$REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$SHA" = "$main_sha" || {
            echo "Release was superseded before Rich Menu publication."
            exit 1
          }

      - name: Publish Rich Menu desired state
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: pnpm line:rich-menu publish all
