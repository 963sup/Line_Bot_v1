name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Validate repository metadata
        run: pnpm check lint -- package.json architecture knip.jsonc
      - name: Validate repository contracts
        run: pnpm check check:repository
      - name: Validate lifecycle hooks
        run: pnpm check codex:config hooks
      - name: Validate workflows
        uses: docker://rhysd/actionlint:1.7.12
      - name: Validate patch
        run: pnpm check patch
