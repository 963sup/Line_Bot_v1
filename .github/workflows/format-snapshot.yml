name: Format Snapshot

on:
  push:
    branches: [fix/vercel-node-runtime-contract]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - name: Commit canonical formatter output and retire helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm --ignore-unmatch .github/workflows/format-snapshot.yml
          git commit -m 'style: apply canonical formatter'
          git push origin HEAD:fix/vercel-node-runtime-contract
