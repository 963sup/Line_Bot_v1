name: WBS Transfer
run-name: WBS transfer ${{ inputs.transfer_id }}

on:
  workflow_dispatch:
    inputs:
      transfer_id:
        description: Authenticated WBS transfer intent UUID
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  transfer:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: supabase-production-nmssogphayjymjpbnrxv
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build WBS transfer runtime
        run: >-
          pnpm exec turbo run build
          --filter=@line_bot_v1/wbs...
          --filter=@line_bot_v1/actions...
          --filter=@line_bot_v1/notifications...
      - name: Require current main before operator execution
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: pnpm github:current-main --sha "$SHA"
      - name: Execute authenticated WBS transfer intent
        env:
          GITHUB_TOKEN: ${{ github.token }}
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_CONFIRM_PROJECT: nmssogphayjymjpbnrxv
          SUPABASE_RELEASE_SHA: ${{ github.sha }}
          SUPABASE_REMOTE_MUTATION_CONTEXT: validated-main
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          TRANSFER_ID: ${{ inputs.transfer_id }}
        run: pnpm wbs:transfer --transfer-id "$TRANSFER_ID"
