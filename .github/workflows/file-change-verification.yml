name: File change verification

on:
  pull_request:
    paths:
      - "packages/file/**"
      - "apps/web/src/modules/file/**"
      - "apps/web/src/app/api/_composition/files.server.ts"
      - "apps/web/src/app/api/repository-files/route.ts"
      - "apps/web/test/files-owner-http.test.ts"
      - "architecture/domain/owners/file.json"
      - ".github/workflows/file-change-verification.yml"

permissions:
  contents: write

jobs:
  file-boundary:
    name: file-boundary
    if: github.event.pull_request.number == 441 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAPABILITY_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/file-fast-path-20261027
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Apply canonical Biome formatting to cohesive File refactor
        run: |
          pnpm check format -- packages/file/src packages/file/test packages/file/package.json apps/web/src/modules/file apps/web/src/app/api/_composition/files.server.ts apps/web/test/files-owner-http.test.ts architecture/domain/owners/file.json
          git add packages/file/src packages/file/test packages/file/package.json apps/web/src/modules/file apps/web/src/app/api/_composition/files.server.ts apps/web/test/files-owner-http.test.ts architecture/domain/owners/file.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(file): format cohesive File package and Web modules"
            git push origin HEAD:refs/heads/refactor/file-fast-path-20261027
          fi
      - name: Lint affected File sources
        run: pnpm check lint -- packages/file/src packages/file/test apps/web/src/modules/file apps/web/src/app/api/_composition/files.server.ts apps/web/test/files-owner-http.test.ts test/files-signed-upload.test.ts
      - name: Typecheck File and Web with dependency builds
        run: pnpm exec turbo run typecheck --filter=@line_bot_v1/file --filter=@line_bot_v1/web --concurrency=2
      - name: File owner unit and persistence tests
        run: pnpm exec turbo run test --filter=@line_bot_v1/file --concurrency=2
      - name: Web transport regression tests
        run: pnpm --filter @line_bot_v1/web exec node --no-wasm-code-gc --import tsx --test test/files-owner-http.test.ts
