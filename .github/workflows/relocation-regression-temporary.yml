name: Relocation Regression (temporary)

on:
  pull_request:
    branches:
      - work

permissions:
  contents: read

jobs:
  relocation-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build Web workspace dependencies
        run: pnpm exec turbo run build --filter='@line_bot_v1/web^...'
      - name: WBS typecheck
        run: pnpm --filter @line_bot_v1/wbs typecheck
      - name: WBS unit tests
        run: pnpm --filter @line_bot_v1/wbs test
      - name: Web typecheck
        run: pnpm --filter @line_bot_v1/web typecheck
      - name: Web unit tests
        run: pnpm --filter @line_bot_v1/web test
