name: Relocation Regression (temporary)

on:
  pull_request:
    branches:
      - work

permissions:
  contents: read

jobs:
  relocation-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WBS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build Web workspace dependencies
        run: pnpm exec turbo run build --filter='@line_bot_v1/web^...'
      - name: WBS typecheck
        run: pnpm --filter @line_bot_v1/wbs typecheck
      - name: WBS unit tests
        run: pnpm --filter @line_bot_v1/wbs test
      - name: Web typecheck
        run: pnpm --filter @line_bot_v1/web typecheck
      - name: Web unit tests
        run: pnpm --filter @line_bot_v1/web test
