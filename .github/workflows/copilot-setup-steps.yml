name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .devcontainer/devcontainer.json
      - .node-version
      - package.json
      - pnpm-lock.yaml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .devcontainer/devcontainer.json
      - .node-version
      - package.json
      - pnpm-lock.yaml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - name: Install official Serena tooling
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Provision Serena MCP launcher
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/uv-tools
        run: uv tool install --force serena-agent==2.1.0
      - name: Restore workspace build cache
        uses: actions/cache@v6
        with:
          path: |
            .turbo
            apps/web/.next/cache
          key: copilot-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', 'package.json', 'pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            copilot-${{ runner.os }}-${{ runner.arch }}-
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
