# 在 Serena 中或與 LLM 對話時，用來指稱此專案的名稱。
project_name: line-bot-v1

# 使用 LSP 後端時要啟動的語言伺服器清單；可選值如下：
#   ada                    al                     angular                ansible                astro
#   bash                   bsl                    clojure                cpp                    cpp_ccls
#   crystal                csharp                 csharp_omnisharp       cue                    dart
#   deno                   elixir                 elm                    erlang                 fortran
#   fsharp                 gdscript               gleam                  go                     groovy
#   haskell                haxe                   hlsl                   html                   java
#   json                   julia                  julia_fatou            kotlin                 latex
#   lean4                  lua                    lua_emmylua            luau                   markdown
#   matlab                 msl                    nextflow               nix                    ocaml
#   pascal                 perl                   php                    php_devsense           php_phpactor
#   php_phpantom           powershell             python                 python_basedpyright    python_jedi
#   python_pyrefly         python_ty              qml                    r                      rego
#   ruby                   ruby_solargraph        rust                   scala                  scss
#   solidity               svelte                 swift                  systemverilog          terraform
#   toml                   typescript             typescript_tsgo        typescript_vts         vue
#   vbnet                  wolfram                yaml                   zig
#   （此清單由 scripts/print_language_list.py 產生，可能已過時；
#   最新清單請參閱下列位置的 LanguageServerId 列舉值：
#   https://github.com/oraios/serena/blob/main/src/solidlsp/ls_config.py)
# 部分語言有多種語言伺服器可選，例如 csharp_omnisharp、ruby_solargraph。
# 注意：
#   - C 使用 cpp。
#   - JavaScript 使用 typescript。
#   - Angular 專案使用 angular（涵蓋 typescript+html；須在專案根目錄執行 `npm install`）。
#   - Astro 專案使用 astro（涵蓋 .astro 專案的 typescript/javascript；需要 npm）。
#   - Svelte 專案使用 svelte（涵蓋 .svelte 專案的 typescript/javascript；需要 npm）。
#   - Deno 專案使用 deno（處理與 typescript 相同的 .ts/.js 檔案；PATH 中須有 deno CLI）。
#   - SCSS、Sass 與純 CSS 使用 scss（some-sass-language-server 支援這三者）。
#   - Free Pascal/Lazarus 使用 pascal。
#   - 外部 Python 配接器可能註冊其他 ID；請先安裝配接器套件，
#     再於此處使用其 ID，例如 example。
# 特殊需求：
#   部分語言伺服器需要額外設定或安裝。
#   詳見：https://oraios.github.io/serena/01-about/020_programming-languages.html#language-servers
# 使用多個語言伺服器時，會以清單中第一個支援該檔案的伺服器處理該檔案。
# 第一個語言伺服器代表預設語言，對應的語言伺服器也會作為備援。
# 使用 JetBrains 後端時不會使用語言伺服器，因此會忽略此清單。
language_servers:
- typescript

# 是否依照專案的 .gitignore 規則忽略檔案。
ignore_all_files_in_gitignore: true

# 此專案額外忽略的路徑清單。
# 語法與 gitignore 相同，可使用 * 與 **。
# 重要：以 `*` 開頭的模式必須加上引號，否則 YAML 會將其視為別名。
# 範例：
#   ignored_paths:
#     - "examples/**"
#     - ".worktrees/**"
#     - "**/bin/**"
#     - "**/obj/**"
# 注意：serena_config.yml 中的全域 ignored_paths 也會合併套用。
ignored_paths:
- ".git/**"
- "node_modules/**"
- "**/node_modules/**"
- ".agents/**"
- ".codex/**"
- ".github/**"
- ".serena/**"
- ".tools/**"
- ".artifacts/**"
- ".vercel/**"
- ".next/**"
- ".turbo/**"
- ".pnpm-store/**"
- ".data/**"
- ".cache/**"
- "build/**"
- "dist/**"
- "out/**"
- "logs/**"
- ".tmp_*/**"
- ".codex-remote-attachments/**"
- "packages/integration-supabase/src/.temp/**"
- "coverage/**"
- "architecture/**"
- "docs/**"
- "assets/**"
- "apps/web/public/**"
- "packages/integration-supabase/src/schemas/**"

# 專案是否處於唯讀模式。
# 設為 true 時，所有編輯工具都會停用，嘗試使用時會回報錯誤。
# 於 2025-04-18 新增。
read_only: false

# 預設啟用的模式名稱清單，會覆寫全域設定。
# 實際啟用的模式為 base_modes（來自全域設定）+ default_modes + added_modes。
# 未定義或留空時，使用全域設定（serena_config.yml）的 default_modes。
# 否則會覆寫全域設定（serena_config.yml）中的對應值。
# 若不希望此專案套用全域設定的預設模式，可將此值設為 []。
# CLI 參數（--mode）可進一步覆寫此設定。
# 詳見：https://oraios.github.io/serena/02-usage/050_configuration.html#modes
default_modes:
- interactive
- editing

# 此專案額外啟用的模式名稱清單，例如 ["query-projects"]。
# 實際啟用的模式為 base_modes（來自全域設定）+ default_modes + added_modes。
# 詳見：https://oraios.github.io/serena/02-usage/050_configuration.html#modes
added_modes:

# 在 REPL 中額外啟用原本停用的 API（尤其是預設停用的選配方法）。
# 可指定 facade 或其方法，例如 "lsp" 或 "lsp.get_diagnostics_for_symbol"。
# 此清單會擴充既有的啟用清單（例如全域設定中的清單）。
included_apis:
- cfg
- fs
- edit
- mem
- shell
- ext
- lsp
- edit.delete_lines
- edit.insert_at_line
- edit.replace_lines
- lsp.get_diagnostics_for_symbol
- lsp.restart_language_server
- ext.project_context
# 明確保持所有 v2 REPL 能力啟用；僅列出上述 facade 名稱，
# 無法說明哪些選配的符號、編輯與記憶操作屬於此專案的契約。
- cfg.get_current_config
- fs.create_text_file
- fs.delete_lines
- fs.find_file
- fs.list_dir
- fs.read_file
- fs.replace_content
- fs.search_for_pattern
- edit.insert_after_symbol
- edit.insert_before_symbol
- edit.replace_symbol_body
- edit.replace_in_files
- edit.rename_symbol
- edit.safe_delete_symbol
- lsp.find_declaration
- lsp.find_implementations
- lsp.find_referencing_symbols
- lsp.find_symbol
- lsp.get_diagnostics_for_file
- lsp.get_diagnostics_for_symbol
- lsp.get_symbols_overview
- lsp.rename_symbol
- lsp.safe_delete_symbol
- lsp.restart_language_server
- mem.delete_memory
- mem.edit_memory
- mem.list_memories
- mem.read_memory
- mem.rename_memory
- mem.write_memory

# 從 REPL 排除的 API 清單，可指定 facade 或其方法，例如 "lsp" 或 "lsp.find_symbol"。
# 此清單會擴充既有的排除清單（例如全域設定中的清單）。
excluded_apis: []

# 要排除的工具名稱清單。
# 此清單會擴充既有的排除清單（例如全域設定中的清單）。
# 工具清單：https://oraios.github.io/serena/01-about/035_tools.html
excluded_tools: []

# 額外啟用原本停用的工具清單（尤其是預設停用的選配工具）。
# 此清單會擴充既有的啟用清單（例如全域設定中的清單）。
# 工具清單：https://oraios.github.io/serena/01-about/035_tools.html
included_optional_tools: []

# 每次工具呼叫取得額外符號資訊（如文件字串或參數資訊）的時間預算，單位為秒。
# 此值會覆寫全域設定中的對應值；詳見全域設定的說明。
# 設為 null 或未指定時，使用全域設定。
symbol_info_budget: 5.0

# 此專案使用的語言後端。
# 未設定時，使用 serena_config.yml 中的全域設定。
# 有效值：LSP、JetBrains。
# 注意：後端在啟動時即固定；初始化後若啟用使用不同後端的專案，會回報錯誤。
language_backend: LSP

# agent（LLM）存取 Serena 功能的介面，會覆寫全域設定。
# 有效值：tools、REPL（詳見全域設定）；留空則使用全域設定。
# 注意：介面在啟動時即固定；初始化後才啟用的專案，其介面設定不會套用。
agent_interface: REPL

# 寫入原始碼檔案時使用的換行格式。
# 可不設定（使用全域設定），或設為 "lf"、"crlf"、"native"（平台預設格式）。
# 此設定不影響 Serena 自身的檔案（如記憶與設定檔），它們一律使用平台原生換行格式。
line_ending: lf

# 符合這些正規表示式的記憶項目會標記為唯讀。
# 此清單會與全域設定中的清單合併。
read_only_memory_patterns: []

# 要完全忽略的記憶項目之正規表示式清單。
# 符合的記憶不會出現在 list_memories 或 activate_project 的輸出中，
# 也無法透過 read_memory 或 write_memory 存取。
# 如需存取被忽略的記憶檔案，請使用 read_file 工具讀取原始檔案路徑。
# 此清單會與全域設定中的清單合併。
# 範例：["_archive/.*", "_episodes/.*"]
ignored_memory_patterns: []

# 工作區資料夾路徑清單（僅適用於 LSP 後端）。
# Serena 會使用這些資料夾建立符號索引。
# 路徑必須位於專案根目錄內，因此應使用相對於專案根目錄的路徑。
# 這些路徑也不應被忽略規則排除。
# 預設會納入整個專案根目錄（"."）。
# 在大型 monorepo 中，可用此設定僅索引專案根目錄下的部分子目錄，例如：
#   ls_workspace_folders:
#     - "./subproject1"
#     - "./subproject2"
ls_workspace_folders:
- .

# 為支援跨套件引用而加入的額外工作區資料夾路徑清單。
# 可使用絕對路徑或相對於專案根目錄的路徑。
# 每個資料夾都會註冊為 LSP 工作區資料夾，讓語言伺服器探索跨套件的符號與引用。
# 但 Serena 不會為這些資料夾建立索引，因此其符號無法透過 Serena 的符號搜尋工具找到。
# 範例：
#   additional_workspace_folders:
#     - ../sibling-package
#     - ../shared-lib
ls_additional_workspace_folders: []

# 專案的初始提示；每次啟用專案時都會提供給 LLM（記憶則是按需載入）。
initial_prompt: >-
  在目前啟用的 worktree 中工作，遵守儲存庫的 AGENTS.md 與治理契約。
  使用 Serena 進行語義符號導覽、引用查詢、診斷、重構、專案啟用、onboarding 與專案記憶操作。
  新專案 session 開始時，檢查目前設定與記憶清單；只有專案記憶尚不存在時才執行 onboarding。
  不要自動開啟網頁儀表板。對於 Serena 無法提供獨特助益的操作，
  使用 Codex 原生的檔案編輯、shell、Git、測試與驗證工具。
  Serena 的輸出是探索或操作證據，不能取代儲存庫的權威來源或驗收驗證。
  任何可能產生大量輸出的 shell 驗證或輪詢命令，都應保留有界的結構化摘要；
  輪詢須使用穩定的去重鍵，並只讀取摘要，不讀取原始日誌。

# 專案文字檔案使用的編碼。
# 可用編碼清單：https://docs.python.org/3.11/library/codecs.html#standard-encodings
encoding: utf-8

# 語言後端（LSP 或 JetBrains）初始化前可選擇執行的 shell 命令。
# 命令在專案根目錄執行，且僅在專案受信任時執行
# （請參閱全域設定中的 trusted_project_path_patterns）。
# Serena 會等待命令結束；非零結束碼會記錄為錯誤，但不會中止專案啟用。
# 專案層級的逾時設定（activation_command_timeout，預設 180 秒）
# 用於處理未結束的命令；逾時後會終止該程序並繼續啟用專案。
# 範例：activation_command: "npx nx run-many -t build"
activation_command:

# 等待 activation_command 完成的最長秒數，超時即終止命令（預設 180 秒）。
# 必須為正數。
activation_command_timeout: 180.0

# 語言伺服器專屬選項的進階設定，以語言鍵對應各項選項。
# 只有專案受信任時才會採用這些設定（受信任專案的定義方式請參閱全域設定）。
# 詳見：https://oraios.github.io/serena/02-usage/050_configuration.html#language-server-specific-settings
ls_specific_settings:
  typescript:
    # 重用儲存庫固定的 5.1.3 版語言伺服器與 TypeScript 5.9.3，
    # 避免另外建立一份由 Serena 管理的 npm 安裝。
    ls_path: node_modules/.bin/typescript-language-server
    server_ready_timeout: 30.0
    indexing_start_grace: 10.0
    indexing_timeout: 60.0

# 固定的基礎工具集合；非空時會取代 Serena 的預設工具集合。
# 不可與非空的 excluded_tools 或 included_optional_tools 同時使用。
# 工具清單：https://oraios.github.io/serena/01-about/035_tools.html
fixed_tools: []
